# Runtime lock coordination policy.
# Contract owner: ORESoftware/ores-locks-and-leases.
# Repository audit: ORESoftware/ores-cli.
# Package/build/install/publish/test mechanics stay in .zpkg.toml.
# Secret values are resolved from environment/secret stores; only names and metadata live here.

schema_version = "ores.lock.config.v1"
default_profile = "service-composed"
selected_profile_env = "ORES_LOCK_PROFILE"

[[env]]
key = "ORES_LOCK_PROFILE"
kind = "string"
required = false
secret = false
purpose = "Select one declared lock profile at process startup."

[[env]]
key = "FIDUCIA_BASE_URL"
kind = "url"
required = false
secret = false
purpose = "Fiducia lease authority endpoint."

[[env]]
key = "FIDUCIA_AUTH_TOKEN"
kind = "string"
required = false
secret = true
purpose = "Credential for the Fiducia lease authority."

[[env]]
key = "DATABASE_URL"
kind = "string"
required = false
secret = true
purpose = "PostgreSQL connection string used by the advisory-lock provider."

[[profiles]]
profile_id = "service-composed"
wait = true
wait_timeout_ms = 30000
retry_interval_ms = 50
ttl_ms = 30000
renew_interval_ms = 10000

[profiles.providers]
local_file = false
fiducia = true
pg_advisory = true

[profiles.fiducia]
endpoint_env = "FIDUCIA_BASE_URL"
auth_token_env = "FIDUCIA_AUTH_TOKEN"

[profiles.postgres]
database_url_env = "DATABASE_URL"
scope = "transaction"
