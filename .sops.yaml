# Public age recipients only. Private identities never enter Git.
# Fleet convention: env/enc/dev.env.enc and env/enc/prod.env.enc.
keys:
  - &alex age1qrnva7lnv2jzww6ah5au0cqm4wkvkm5shpzflekdcm4nlu6wnyfqgfaxft # alex@dancingdragons.cc
  - &recovery age1txv6jzlds2s03advmdtnm5l93qh4rkqs50nwvzk9yfvsartzue8se8t7jv # offline recovery

creation_rules:
  - path_regex: env/enc/dev\.env\.enc$
    input_type: dotenv
    output_type: dotenv
    key_groups:
      - age:
          - *alex
          - *recovery
  - path_regex: env/enc/prod\.env\.enc$
    input_type: dotenv
    output_type: dotenv
    key_groups:
      - age:
          - *alex
          - *recovery
  - path_regex: env/enc/.*\.env\.enc$
    input_type: dotenv
    output_type: dotenv
    key_groups:
      - age:
          - *alex
          - *recovery
