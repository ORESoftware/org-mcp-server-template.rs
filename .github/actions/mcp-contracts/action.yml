name: MCP peer contracts and real stdio conformance
description: Verify independent TypeSpec/JSON Schema authorities, digest-bound IR, and six inherited read-only tools.
inputs:
  profile:
    description: Explicit reviewed contract version (stdio-v1 or fleet-v2); never inferred from output.
    required: false
    default: stdio-v1
  binary:
    description: Cargo binary target to build and test (not a shell command).
    required: false
    default: org-mcp-server
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22.16.0
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: ORESoftware/mcp-rust-libs
        ref: 487df19ec2542616924041bc244c5660c1ed0bf4
        path: .mcp-contract-tools/shared
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: ORESoftware/typespec-json-schema-validator
        ref: 2281843126ab644607b11cf8281d84f382d68dfc
        path: .mcp-contract-tools/validator
        persist-credentials: false
    - name: Verify and install lockfile-pinned contract compiler
      shell: bash
      working-directory: .mcp-contract-tools/validator
      run: |
        test "$(git rev-parse HEAD)" = 2281843126ab644607b11cf8281d84f382d68dfc
        git diff --exit-code HEAD
        npm ci --omit=dev
    - name: Test the shared and template wire verifiers
      shell: bash
      env:
        MCP_ACTION_ROOT: ${{ github.action_path }}/../../..
        MCP_SHARED_TOOLS_ROOT: ${{ github.workspace }}/.mcp-contract-tools/shared
      run: |
        node --test "$MCP_SHARED_TOOLS_ROOT/test"/org-mcp-*.test.mjs
        node --test "$MCP_ACTION_ROOT/tooling"/mcp-wire*.test.mjs
    - name: Build the actual server with its existing lockfile
      shell: bash
      env:
        MCP_BIN_NAME: ${{ inputs.binary }}
      run: cargo build --locked --bin "$MCP_BIN_NAME"
    - name: Verify parity, exact-source admission, and real stdio behavior
      shell: bash
      env:
        MCP_ACTION_ROOT: ${{ github.action_path }}/../../..
        MCP_VALIDATOR_ROOT: ${{ github.workspace }}/.mcp-contract-tools/validator
        MCP_SHARED_TOOLS_ROOT: ${{ github.workspace }}/.mcp-contract-tools/shared
        MCP_BINARY: ${{ github.workspace }}/target/debug/${{ inputs.binary }}
        MCP_EXPECTED_REPOSITORY: ${{ github.repository }}
        MCP_CONTRACT_PROFILE: ${{ inputs.profile }}
        MCP_CONTRACT_OUTPUT: ${{ runner.temp }}/mcp-peer-contracts
      run: |
        export MCP_TESTED_COMMIT="$(git rev-parse HEAD)"
        node "$MCP_ACTION_ROOT/tooling/mcp-contracts.mjs"
    - name: Preserve validator source
      shell: bash
      run: git -C .mcp-contract-tools/validator diff --exit-code HEAD
    - name: Preserve parity and runtime evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: mcp-peer-contract-evidence
        path: ${{ runner.temp }}/mcp-peer-contracts
        if-no-files-found: error
        retention-days: 14
