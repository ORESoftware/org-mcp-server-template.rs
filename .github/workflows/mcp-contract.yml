name: MCP peer contracts and implementation
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  peer-contract-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify reviewed template head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ORESoftware/mcp-rust-libs
          ref: 487df19ec2542616924041bc244c5660c1ed0bf4
          path: .contract-tools
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: 2281843126ab644607b11cf8281d84f382d68dfc
          path: .contract-validator
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Verify and install pinned compiler dependencies
        run: |
          test "$(git -C .contract-validator rev-parse HEAD)" = 2281843126ab644607b11cf8281d84f382d68dfc
          git -C .contract-validator diff --exit-code HEAD
          npm ci --prefix .contract-validator
          test ! -e node_modules
          ln -s .contract-validator/node_modules node_modules
      - name: Test shared runner
        run: node --test .contract-tools/test/org-mcp-*.test.mjs
      - name: Check Rust and build actual template binary
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo build --locked --bin org-mcp-server
      - name: Fresh peer parity, negative controls, IR and implementation conformance
        run: node scripts/check-mcp-contract.mjs
      - name: Preserve current-run evidence (failed is not admission)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-contract-${{ github.sha }}
          path: artifacts/mcp-contract/
          if-no-files-found: error
          retention-days: 14
      - name: Neither authored authority nor validator source was rewritten
        run: |
          git diff --exit-code -- contracts Cargo.toml Cargo.lock src
          git -C .contract-validator diff --exit-code HEAD
