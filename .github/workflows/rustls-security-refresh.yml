name: rustls security refresh

on:
  push:
    branches: [config/ores-lock-v1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rustls-security-refresh
  cancel-in-progress: true

jobs:
  refresh-verify-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: config/ores-lock-v1
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy

      - name: Refresh patched rustls only
        run: cargo +1.88.0 update -p rustls --precise 0.23.45

      - name: Verify exact refreshed dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.88.0 metadata --locked --format-version 1 >/dev/null
          cargo +1.88.0 fmt --all -- --check
          cargo +1.88.0 clippy --locked --all-targets -- -D warnings
          cargo +1.88.0 test --locked --all-targets
          RUSTDOCFLAGS='-D warnings' cargo +1.88.0 doc --locked --no-deps
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --deny warnings
          grep -A3 'name = "rustls"' Cargo.lock | grep 'version = "0.23.45"'
          git diff --check

      - name: Commit verified lockfile and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rustls-security-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock .github/workflows/rustls-security-refresh.yml
          git commit -m 'fix(security): update rustls to 0.23.45'
          git push origin HEAD:config/ores-lock-v1
